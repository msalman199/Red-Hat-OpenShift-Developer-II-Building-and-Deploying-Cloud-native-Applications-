apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: enhanced-slack-notification
  namespace: pipeline-notifications
spec:
  params:
    - name: message
      type: string
      description: The message to send to Slack
    - name: status
      type: string
      description: Pipeline status
    - name: pipeline-name
      type: string
      description: Name of the pipeline
    - name: pipeline-run-name
      type: string
      description: Name of the pipeline run
      default: "unknown"
    - name: namespace
      type: string
      description: Namespace where pipeline is running
      default: "default"
  steps:
    - name: send-enhanced-notification
      image: curlimages/curl:latest
      env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: slack-webhook
              key: url
      script: |
        #!/bin/sh
        
        # Set color and emoji based on status
        if [ "$(params.status)" = "success" ]; then
          COLOR="good"
          EMOJI=":white_check_mark:"
        else
          COLOR="danger"
          EMOJI=":x:"
        fi
        
        # Get current timestamp
        TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        # Create enhanced JSON payload
        PAYLOAD=$(cat <<JSON
        {
          "username": "OpenShift Pipeline Bot",
          "icon_emoji": ":robot_face:",
          "attachments": [
            {
              "color": "${COLOR}",
              "title": "Pipeline Notification",
              "fields": [
                {
                  "title": "Status",
                  "value": "${EMOJI} $(params.status)",
                  "short": true
                },
                {
                  "title": "Pipeline",
                  "value": "$(params.pipeline-name)",
                  "short": true
                },
                {
                  "title": "Pipeline Run",
                  "value": "$(params.pipeline-run-name)",
                  "short": true
                },
                {
                  "title": "Namespace",
                  "value": "$(params.namespace)",
                  "short": true
                },
                {
                  "title": "Message",
                  "value": "$(params.message)",
                  "short": false
                },
                {
                  "title": "Timestamp",
                  "value": "${TIMESTAMP}",
                  "short": false
                }
              ]
            }
          ]
        }
JSON
        )
        
        # Send notification
        curl -X POST -H 'Content-type: application/json' \
          --data "${PAYLOAD}" \
          "${SLACK_WEBHOOK_URL}"
        
        echo "Enhanced notification sent to Slack"
