apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: debug-pipeline
spec:
  params:
    - name: git-url
      type: string
      default: "https://github.com/openshift/nodejs-ex.git"
    - name: image-name
      type: string
      default: "debug-app"
  workspaces:
    - name: shared-workspace
  tasks:
    - name: git-clone
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.git-url)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: failing-build
      taskRef:
        name: failing-build-task
      params:
        - name: image-name
          value: $(params.image-name)
        - name: dockerfile-path
          value: "./Dockerfile.missing"
      workspaces:
        - name: source
          workspace: shared-workspace
      runAfter:
        - git-clone
