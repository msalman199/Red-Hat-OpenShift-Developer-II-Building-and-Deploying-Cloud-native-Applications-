apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: sequential-build-pipeline
  namespace: pipeline-parallel-lab
spec:
  params:
    - name: git-url
      type: string
      description: Git repository URL
    - name: git-revision
      type: string
      default: main
      description: Git revision to build
  workspaces:
    - name: shared-data
      description: Shared workspace for pipeline tasks
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
        kind: ClusterTask
      workspaces:
        - name: output
          workspace: shared-data
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)

    - name: code-analysis
      taskRef:
        name: code-quality-check
      workspaces:
        - name: source
          workspace: shared-data
      runAfter:
        - fetch-source

    - name: security-scan
      taskRef:
        name: security-scanner
      workspaces:
        - name: source
          workspace: shared-data
      runAfter:
        - code-analysis

    - name: unit-tests
      taskRef:
        name: run-tests
      workspaces:
        - name: source
          workspace: shared-data
      runAfter:
        - security-scan
