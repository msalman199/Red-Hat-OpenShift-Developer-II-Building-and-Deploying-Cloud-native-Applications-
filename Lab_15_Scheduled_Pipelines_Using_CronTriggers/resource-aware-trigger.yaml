apiVersion: triggers.tekton.dev/v1alpha1
kind: CronTrigger
metadata:
  name: resource-aware-trigger
spec:
  schedule: "0 1 * * 6"  # Every Saturday at 1:00 AM
  pipelineRef:
    name: scheduled-build-pipeline
  params:
    - name: git-url
      value: "https://github.com/tektoncd/pipeline.git"
    - name: git-revision
      value: "main"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: fast-ssd
  podTemplate:
    nodeSelector:
      node-type: build-node
    tolerations:
      - key: "build-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
