apiVersion: triggers.tekton.dev/v1alpha1
kind: CronTrigger
metadata:
  name: frequent-test-trigger
spec:
  schedule: "*/15 * * * *"  # Every 15 minutes
  pipelineRef:
    name: scheduled-build-pipeline
  params:
    - name: git-url
      value: "https://github.com/tektoncd/pipeline.git"
    - name: git-revision
      value: "main"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
