apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
data:
  app.properties: |
    app.name=nodejs-workspace-demo
    app.version=1.0.0
    build.environment=development
    logging.level=info
  build.yaml: |
    build:
      compiler: node
      version: "16"
      optimization: true
      tests: enabled
